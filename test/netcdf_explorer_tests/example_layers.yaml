
# specify which dimension is used to provide the case
# all the variables referenced in the layers section must include this dimension

dimensions:
  case: time
  x: x
  y: y

# specify the names of the coordinates used in the time, x and y dimensions
# note that all these coordinates must be 1-dimensional
# the x- and y-coordinates must define a regular grid

coordinates:
  x: x
  y: y
  time: time

image:
  grid-width: 250
  max-zoom: 10

info:
  Date: "${str(data[\"time\"].data)[0:19]}"

# derive new bands from expressions using the variables in the input dataset. Expressions can use:
#     arithmetic: + - * / and unary minus, for example -ST
#     bitwise operators on integers: & |
#     comparisons: == > >= < <=
#     logical operators: and or not
#     the function IF(condition, value_if_true, value_if_false)
# operators bind in this order, most tightly first: unary - and not, then * /, then + -, then & |, then comparisons,
# then and/or. Use parentheses to change the order.
derive_bands:
  CLOUD_MASK: "not (QA_PIXEL & 8 == 0)"
  EXTENDED_CLOUD_MASK: "not (QA_PIXEL & 30 == 0)"
  DISCRETE_TEMP: IF(ST > 290, 3, IF(ST > 280, 2, 1))

timeseries:
  ST_cloudy:
    masks: ["CLOUD_MASK","EXTENDED_CLOUD_MASK"]
    variables: ["ST"]

# specify the layers
layers:
# layer objects all have a type and label attribute
# the label is a meaningful description of the layer, used in the html output
# the type is one of the following:
#     type=mask: layer represents an integer or boolean variable containing a mask
#     type=single: layer represents a variable containing a continuous quantity
#     type=discrete: layer represents a variable containing a discrete quantity
#     type=rgb: layer represents a false colour depiction of three variables
#     type=wms: layer represents a WMS image obtained from a specified WMS service
#
# depending upon the type, other attributes are also available
#
# a layer can set its own x and y dimensions and coordinates, for a variable whose dimensions or coordinates
# are named differently from those set at the top of this file, for example:
#     dimensions:
#       x: lon_dim
#       y: lat_dim
#     coordinates:
#       x: lon
#       y: lat
# the layer's coordinates decide which way up its image is drawn. The variable may have a different resolution
# from the other layers, but should cover the same area, as its image is stretched to fill the same map area.
# The case dimension and time coordinate can only be set at the top of this file.
#
# examples of each of the layer types are included below
  CLOUD_MASK:
    label: "Basic Cloud Mask (8)"
    type: "mask"
    band: "CLOUD_MASK"
    r: 200  # r,g,b specifies the colour to show when the pixel is included (transparent if not)
    g: 200
    b: 200

  ALL_CLOUD_MASK:
    label: "Extended Cloud Mask (30)"
    type: "mask"
    band: "EXTENDED_CLOUD_MASK"
    r: 150
    g: 150
    b: 150

  ST:
    label: "Surface Temperature"
    type: "single"
    band: "ST" # use the ST variable in the input dataset
    min_value: 270 # specify the range of values to be depicted
    max_value: 300
    cmap: "rainbow"  # specify a colour map, known to matplotlib (see https://matplotlib.org/stable/users/explain/colors/colormaps.html)
    data:
      label: "B10_ST: {value} K"
      fixed: 2

  DISCRETE_ST:
    label: "Surface Temperature Discrete"
    type: "discrete"
    band: "DISCRETE_TEMP"
    values:
      1: ["low","blue"]
      2: ["medium","purple"]
      3: ["high","red"]

  REF:
    label: "Reflectance"
    type: "rgb"
    red_band: "B4"      # variable to use to provide red intensity
    green_band: "B3"    # variable to use to provide green intensity
    blue_band: "B2"     # variable to use to provide blue intensity
    red_gamma: 0.5      # gamma correction - boost reds (smaller values increase boost)
    green_gamma: 0.5    # gamma correction - boost greens (smaller values increase boost)
    blue_gamma: 0.5     # gamma correction - boost blues (smaller values increase boost)
    # additionally, specify EITHER min_value/max_value OR low_percentile/hight_percentile to restrict the value range
    # min_value: 0.0      # apply linear normalisation with this minimum value
    # max_value: 0.5      # apply linear normalisation with this maximum value
    # low_percentile: 2   # apply linear normalisation with the minimum value computed from this percentile
    # high_percentile: 98 # apply linear normalisation with the maximum value computed from this percentile

  OSM:
    label: "Open Street Map"
    type: "wms"
    scale: 1  # increase this to request a larger, more detailed WMS image
      # specify a WMS provider URL that should include placeholders {WIDTH}, {HEIGHT}, {XMIN}, {YMIN}, {XMAX}, {YMAX}
      # note that the URL should specify the correct CRS for the projection used in the variable's x and y coordinates
    url: "https://eocis.org/mapproxy/service?service=WMS&request=GetMap&layers=osm&styles=&format=image%2Fpng&transparent=false&version=1.1.1&width={WIDTH}&height={HEIGHT}&srs=EPSG%3A27700&bbox={XMIN},{YMIN},{XMAX},{YMAX}"

terrain_view:
  # normally the terrain view would use digital elevation data, for illustrative purposes we can use surface temperature
  based_on_layer: ST
  pixel_size_in_elevation_units: 5
